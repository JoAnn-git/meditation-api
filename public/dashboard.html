<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="container">
    <h1>🧘 My Sessions</h1>

    <input id="duration" placeholder="Duration (minutes)">
    <input id="notes" placeholder="Notes">
    <button onclick="addSession()">Add Session</button>
    <div id="confirmBox" style="display:none; background:white; padding:20px; border:1px solid #ccc;">
    <p id="confirmText"></p>
        <button onclick="confirmAdd()">Confirm</button>
        <button onclick="closeConfirm()">Cancel</button>
    </div>

    <ul id="list"></ul>

    <button onclick="logout()" style="background:#e53935;">
      Logout
    </button>
  </div>

  <script>
  
    const token = localStorage.getItem("token");


    if (!token) {
      window.location.href = "/login.html";
    }

  
    async function loadSessions() {
      try {
        const res = await fetch('/sessions', {
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        const data = await res.json();

        const list = document.getElementById('list');
        list.innerHTML = '';

   
        if (data.length === 0) {
          list.innerHTML = "<p>No sessions yet, please have a sit and add the session</p>";
          return;
        }

        data.forEach(s => {
          const li = document.createElement('li');

          const date = new Date(s.date).toLocaleString();

          li.innerText = `🕒 ${s.duration} min - ${s.notes} (${date})`;

          list.appendChild(li);
        });

      } catch (err) {
        console.error(err);
      }
    }

   let pendingData = null;

function showConfirm(duration, notes) {
  pendingData = { duration, notes };

  document.getElementById('confirmText').innerText =
    `Add ${duration} min session?`;

  document.getElementById('confirmBox').style.display = 'block';
}

function closeConfirm() {
  document.getElementById('confirmBox').style.display = 'none';
}

async function confirmAdd() {
  const { duration, notes } = pendingData;

  await fetch('/sessions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ duration: Number(duration), notes })
  });

  closeConfirm();
  loadSessions();
}
   function addSession() {
  const duration = document.getElementById('duration').value;
  const notes = document.getElementById('notes').value;

  if (!duration) {
    alert("Please enter duration");
    return;
  }
  if (!isValidNumber(duration)) {
        alert("Please enter duration as a number");
        return;
      }
  // 👉 redirect to confirm page with data
  const url = `/confirm.html?duration=${duration}&notes=${encodeURIComponent(notes)}`;
  window.location.href = url;
}
    
    function isValidNumber(value) {
  if (value === null || value === undefined) return false;

  const num = Number(value);

  return Number.isFinite(num);
}
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    }

  
    loadSessions();
  </script>
</body>
</html>
