<!DOCTYPE html>
<html>
<head>
  <title>Meditation App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 20px;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #45a049;
    }

    .token {
      font-size: 12px;
      word-break: break-all;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .section {
      margin-bottom: 25px;
    }
    ul {
  list-style: none;
  padding: 0;
}

li {
  background: #f9f9f9;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: 1px solid #eee;
}
  </style>
</head>

<body>
  <div class="container">
    <h1>The Meditation App</h1>

    <div class="section">
      <h2>Register</h2>
      <input id="reg-username" placeholder="Username">
      <input id="reg-password" type="password" placeholder="Password">
      <button onclick="register()">Register</button>
    </div>

    <div class="section">
      <h2>Login</h2>
      <input id="login-username" placeholder="Username">
      <input id="login-password" type="password" placeholder="Password">
      <button onclick="login()">Login</button>

      <div id="token" class="token"></div>
    </div>

    <div class="section">
      <h2>Add Session</h2>
      <input id="duration" placeholder="Duration (minutes)">
      <input id="notes" placeholder="Notes">
      <button onclick="createSession()">Add Session</button>
    </div>

    <div class="section">
  <h2>My Sessions</h2>
  <button onclick="loadSessions()">Refresh</button>
  <ul id="session-list"></ul>
</div>
  </div>

  <script>
    let token = '';

    async function register() {
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-password').value;

      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      alert(JSON.stringify(data));
    }

  async function login() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;

  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();
  token = data.token;

  document.getElementById('token').innerText = token
    ? "Logged in ✅"
    : "Login failed ❌";

  if (token) {
    loadSessions(); // 👈 load sessions immediately
  }
}

   async function createSession() {
  const duration = document.getElementById('duration').value;
  const notes = document.getElementById('notes').value;

  const res = await fetch('/sessions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ duration: Number(duration), notes })
  });

  const data = await res.json();

  loadSessions(); // 👈 refresh list
}

    async function loadSessions() {
  const res = await fetch('/sessions', {
    headers: {
      'Authorization': 'Bearer ' + token
    }
  });

  const data = await res.json();

  const list = document.getElementById('session-list');
  list.innerHTML = '';

  data.forEach(session => {
    const li = document.createElement('li');
  
  const date = new Date(session.date).toLocaleString();
  li.innerText = `🕒 ${session.duration} min - ${session.notes} (${date})`;

    list.appendChild(li);
  });
}

    localStorage.setItem("token", token);
  </script>
</body>
</html>S
